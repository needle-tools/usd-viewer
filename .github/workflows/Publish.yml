name: Release
on:
  push:
    branches:
      - 'release/*'

jobs:
  run-release-script:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare viewer SDK modules
        run: cp -R usd-wasm/src public/usd

      - name: Fast viewer tests
        run: npm test

      - name: Fast binding tests
        run: npm run --prefix usd-wasm test:bindings

      - name: Check publication metadata without publishing
        working-directory: usd-wasm
        run: npm publish --dry-run --ignore-scripts --json

      - name: Publish to npm (stable branch)
        if: startsWith(github.ref_name, 'release/stable')
        run: npx --yes needle-publish-helper@next publish "./usd-wasm" --webhook "${{ secrets.DISCORD_WEBHOOK }}" --oidc --tag "stable" --create-tag "release/" --llm-api-key "${{ secrets.LLM_API_KEY }}"

      - name: Publish to npm (latest branch)
        if: startsWith(github.ref_name, 'release/latest')
        run: npx --yes needle-publish-helper@next publish "./usd-wasm" --webhook "${{ secrets.DISCORD_WEBHOOK }}" --oidc --tag "latest" --create-tag "release/" --llm-api-key "${{ secrets.LLM_API_KEY }}"

      - name: Publish to npm (next and experimental branches)
        if: ${{ !startsWith(github.ref_name, 'release/stable') && !startsWith(github.ref_name, 'release/latest') }}
        run: npx --yes needle-publish-helper@next publish "./usd-wasm" --webhook "${{ secrets.DISCORD_WEBHOOK }}" --oidc --tag "${{ github.ref_name }}" --version+time --version+name --version+tag --version+hash --create-tag "release/" --llm-api-key "${{ secrets.LLM_API_KEY }}"
